<!-- 기존 코드에서 수정/추가된 핵심 부분 위주로 구성 -->
<!-- 정산 탭 UI와 멤버 입력 UI가 포함되었습니다. -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트래블 머니 로그 + 정산</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .tab-active { color: #2563eb; font-weight: 800; border-bottom: 4px solid #2563eb; }
        .form-input { background-color: #ffffff; border: 2px solid #f1f5f9; border-radius: 1.25rem; padding: 1rem 1.25rem; width: 100%; font-weight: 600; }
        .toggle-btn { transition: all 0.2s; font-weight: 800; border-radius: 1rem; padding: 0.5rem 1rem; font-size: 0.75rem; }
        .active-blue { background-color: #2563eb; color: white; }
        .inactive-gray { background-color: #f1f5f9; color: #94a3b8; }
        .member-chip { padding: 0.5rem 1rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 800; cursor: pointer; border: 2px solid transparent; }
        .chip-selected { border-color: #2563eb; background-color: #eff6ff; color: #2563eb; }
        .chip-unselected { background-color: #f8fafc; color: #cbd5e1; }
    </style>
</head>
<body class="text-slate-900 pb-32">

    <!-- 앱 메인 -->
    <div id="app-section" class="">
        <header class="bg-white/90 backdrop-blur-md p-6 border-b flex justify-between items-center sticky top-0 z-50">
            <h1 class="font-black text-2xl text-blue-600 tracking-tighter italic">TRAVEL SETTLE</h1>
            <button onclick="handleLogout()" class="text-[10px] font-black text-slate-400 bg-slate-50 px-4 py-2 rounded-full border border-slate-100 uppercase">Logout</button>
        </header>

        <!-- 하단 바 (정산 탭 추가) -->
        <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white rounded-[2.5rem] flex justify-around p-2 z-50 shadow-2xl border border-slate-100">
            <button onclick="showTab('input')" id="nav-input" class="flex-1 py-4 text-center rounded-[1.5rem] font-black text-sm text-slate-300">기록</button>
            <button onclick="showTab('list')" id="nav-list" class="flex-1 py-4 text-center rounded-[1.5rem] font-black text-sm text-slate-300">목록</button>
            <button onclick="showTab('settle')" id="nav-settle" class="flex-1 py-4 text-center rounded-[1.5rem] font-black text-sm text-slate-300">정산</button>
        </nav>

        <main class="max-w-md mx-auto p-4">
            <!-- 탭 1: 기록 화면 (결제자/정산대상 추가됨) -->
            <section id="tab-input" class="space-y-4 hidden">
                <div class="bg-white p-7 rounded-[2.5rem] shadow-xl border border-slate-100">
                    <h2 id="current-trip-name" class="text-xl font-black text-slate-800 mb-6 pb-4 border-b"></h2>
                    
                    <div class="space-y-6">
                        <!-- 결제자 선택 -->
                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Who Paid? (누가 냈어?)</label>
                            <div id="payer-list" class="flex flex-wrap gap-2"></div>
                        </div>

                        <!-- 지출 정보 -->
                        <div class="space-y-4">
                            <div class="flex gap-2">
                                <input type="date" id="exp-date" class="form-input text-sm">
                                <div class="flex bg-slate-100 p-1 rounded-2xl w-32 shrink-0">
                                    <button onclick="setMethod('현금')" id="m-cash" class="flex-1 toggle-btn">현금</button>
                                    <button onclick="setMethod('카드')" id="m-card" class="flex-1 toggle-btn">카드</button>
                                </div>
                            </div>
                            <input type="text" id="exp-name" placeholder="항목명" class="form-input text-lg font-bold">
                            <input type="number" id="exp-amount" placeholder="0" class="form-input text-4xl font-black text-blue-600">
                        </div>

                        <!-- 정산 대상자 선택 (1/N) -->
                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Split with (함께 쓴 사람)</label>
                            <div id="split-list" class="flex flex-wrap gap-2"></div>
                        </div>

                        <button onclick="saveExpense()" class="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black text-xl shadow-xl shadow-blue-100">기록 완료</button>
                    </div>
                </div>
            </section>

            <!-- 탭 4: 정산 화면 -->
            <section id="tab-settle" class="space-y-4 hidden">
                <div class="flex items-center gap-3 px-4 mb-4">
                    <h2 class="font-black text-2xl text-slate-800">최종 정산서</h2>
                </div>

                <div id="settle-result-container" class="space-y-4 pb-20">
                    <!-- 정산 결과 카드가 여기에 생성됨 -->
                </div>
            </section>

            <!-- 목록 탭 (기존과 동일) -->
            <section id="tab-list" class="hidden space-y-4">
                <div id="trip-card-container" class="space-y-4"></div>
            </section>

            <!-- 상세 탭 (기존과 동일) -->
            <section id="tab-detail" class="hidden space-y-4">
                <div id="expense-list-container"></div>
            </section>
        </main>
    </div>

    <script>
        // Supabase 설정 및 변수는 이전과 동일
        const SUPABASE_URL = 'https://ejalawrpzmbanhjkfwxr.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_AVP0pqFeMHynravz8dd_nw___4f9zQo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTrip = null;
        let selectedPayer = '';
        let selectedSplitMembers = [];
        let selectedMethod = '현금';

        // 1. 멤버 입력이 포함된 여행 생성 함수
        async function createNewTrip() {
            const title = prompt('여행 이름을 입력하세요');
            if(!title) return;
            const membersStr = prompt('멤버 이름을 쉼표로 구분해 입력하세요 (예: 나,철수,영희)');
            if(!membersStr) return;

            const members = membersStr.split(',').map(m => {
                const name = m.trim();
                const account = prompt(`'${name}'의 계좌번호를 입력하세요 (선택)`, '');
                return { name, account };
            });

            const { data, error } = await _supabase.from('trips').insert([{ 
                title, 
                members, 
                user_id: (await _supabase.auth.getUser()).data.user.id 
            }]).select();

            if(data) location.reload();
        }

        // 2. 탭 전환 및 데이터 로드
        function showTab(tabName) {
            ['tab-input', 'tab-list', 'tab-settle', 'tab-detail'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            
            // 네비게이션 스타일
            ['input', 'list', 'settle'].forEach(id => {
                document.getElementById(`nav-${id}`).className = `flex-1 py-4 text-center rounded-[1.5rem] font-black text-sm ${tabName === id ? 'text-blue-600 bg-blue-50' : 'text-slate-300'}`;
            });

            if(tabName === 'input') setupInputForm();
            if(tabName === 'list') loadTrips();
            if(tabName === 'settle') calculateSettlement();
        }

        // 3. 기록 폼 설정 (멤버 리스트 버튼 생성)
        async function setupInputForm() {
            const tripId = localStorage.getItem('lastTripId');
            if(!tripId) return showTab('list');

            const { data: trip } = await _supabase.from('trips').select('*').eq('id', tripId).single();
            currentTrip = trip;
            document.getElementById('current-trip-name').innerText = trip.title;

            // 결제자 및 정산대상 버튼 생성
            const payerCont = document.getElementById('payer-list');
            const splitCont = document.getElementById('split-list');
            payerCont.innerHTML = ''; splitCont.innerHTML = '';

            selectedSplitMembers = trip.members.map(m => m.name); // 기본 전체 선택
            selectedPayer = trip.members[0].name; // 첫 번째 멤버 기본 결제자

            trip.members.forEach(m => {
                // 결제자 버튼
                const pBtn = document.createElement('button');
                pBtn.className = `member-chip ${m.name === selectedPayer ? 'chip-selected' : 'chip-unselected'}`;
                pBtn.innerText = m.name;
                pBtn.onclick = () => {
                    selectedPayer = m.name;
                    setupInputForm(); // 리프레시
                };
                payerCont.appendChild(pBtn);

                // 정산대상 버튼
                const sBtn = document.createElement('button');
                sBtn.className = `member-chip ${selectedSplitMembers.includes(m.name) ? 'chip-selected' : 'chip-unselected'}`;
                sBtn.innerText = m.name;
                sBtn.onclick = () => {
                    if(selectedSplitMembers.includes(m.name)) selectedSplitMembers = selectedSplitMembers.filter(name => name !== m.name);
                    else selectedSplitMembers.push(m.name);
                    setupInputForm();
                };
                splitCont.appendChild(sBtn);
            });
        }

        // 4. 지출 저장 (paid_by, split_members 포함)
        async function saveExpense() {
            const amount = document.getElementById('exp-amount').value;
            const name = document.getElementById('exp-name').value;
            if(!amount || !name || !selectedPayer || selectedSplitMembers.length === 0) return alert('정보를 모두 입력하세요');

            await _supabase.from('expenses').insert([{
                trip_id: currentTrip.id,
                item_name: name,
                amount: amount,
                paid_by: selectedPayer,
                split_members: selectedSplitMembers,
                spent_at: document.getElementById('exp-date').value,
                payment_method: selectedMethod,
                expense_type: '현지'
            }]);

            alert('저장되었습니다!');
            showTab('input');
        }

        // 5. ★ 정산 계산 로직 ★
        async function calculateSettlement() {
            const tripId = localStorage.getItem('lastTripId');
            if(!tripId) return;

            const { data: trip } = await _supabase.from('trips').select('*').eq('id', tripId).single();
            const { data: expenses } = await _supabase.from('expenses').select('*').eq('trip_id', tripId);

            let balances = {}; // 각 멤버별 밸런스
            trip.members.forEach(m => balances[m.name] = 0);

            expenses.forEach(exp => {
                const amt = Number(exp.amount);
                const payer = exp.paid_by;
                const splitWith = exp.split_members || [];

                if(splitWith.length > 0) {
                    const share = amt / splitWith.length;
                    balances[payer] += amt; // 결제자는 일단 전체 금액 이득
                    splitWith.forEach(m => balances[m] -= share); // 정산 대상자들은 자기 몫만큼 손해
                }
            });

            // 정산 결과 출력
            const container = document.getElementById('settle-result-container');
            container.innerHTML = '';

            // 받을 사람과 줄 사람 나누기
            let receivers = [], givers = [];
            for (let name in balances) {
                if (balances[name] > 1) receivers.push({ name, amt: balances[name] });
                else if (balances[name] < -1) givers.push({ name, amt: Math.abs(balances[name]) });
            }

            // 매칭 알고리즘 (간소화)
            givers.forEach(g => {
                receivers.forEach(r => {
                    if (g.amt <= 0 || r.amt <= 0) return;
                    const payAmt = Math.min(g.amt, r.amt);
                    const rAccount = trip.members.find(m => m.name === r.name).account || '계좌 정보 없음';

                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-[2rem] shadow-lg border border-slate-50">
                            <div class="flex justify-between items-center mb-4">
                                <span class="font-black text-slate-400 text-xs uppercase">Transfer Guide</span>
                                <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-[10px] font-black">송금 필요</span>
                            </div>
                            <div class="text-xl font-black mb-2">
                                <span class="text-red-500">${g.name}</span> → <span class="text-blue-600">${r.name}</span>
                            </div>
                            <div class="text-3xl font-black mb-4">${Math.round(payAmt).toLocaleString()}원</div>
                            <div class="bg-slate-50 p-4 rounded-2xl text-xs font-bold text-slate-500">
                                🏦 ${rAccount}
                            </div>
                        </div>
                    `;
                    g.amt -= payAmt;
                    r.amt -= payAmt;
                });
            });
            
            if(container.innerHTML === '') container.innerHTML = '<p class="text-center py-20 text-slate-400 font-bold">정산할 내역이 없습니다.</p>';
        }

        // 초기 실행 및 기존 함수 유지...
        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { currentUser = session.user; showTab('list'); } else { showAuth(); }
        };
    </script>
</body>
</html>
