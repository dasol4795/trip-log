<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>트래블로그 - 여행별 스마트 정산</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .tab-active { color: #2563eb !important; font-weight: 900; border-bottom: 4px solid #2563eb; }
        .form-input { background-color: #ffffff; border: 2px solid #f1f5f9; border-radius: 1.25rem; padding: 1rem 1.25rem; width: 100%; font-weight: 600; }
        .form-input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .toggle-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 800; border-radius: 1rem; padding: 0.6rem 1rem; font-size: 0.75rem; }
        .active-blue { background-color: #2563eb; color: white; }
        .active-cash { background-color: #f59e0b; color: white; }
        .active-card { background-color: #6366f1; color: white; }
        .inactive-btn { background-color: #f1f5f9; color: #94a3b8; }
        .member-chip { padding: 0.5rem 1rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 800; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .chip-selected { border-color: #2563eb; background-color: #eff6ff; color: #2563eb; }
        .chip-unselected { background-color: #f1f5f9; color: #cbd5e1; }
        .expense-row { display: grid; grid-template-columns: 50px 1fr 100px 30px; gap: 8px; align-items: start; padding: 18px 8px; border-bottom: 1px solid #f1f5f9; }
        .trip-completed { opacity: 0.5; filter: grayscale(0.8); }
        /* 긴 제목 대응용 스타일 */
        .full-title { word-break: keep-all; overflow-wrap: break-word; line-height: 1.3; }
        .share-hide { display: none !important; }
    </style>
</head>
<body class="text-slate-900 pb-32">

    <!-- 1. 로그인 섹션 -->
    <div id="auth-section" class="max-w-md mx-auto mt-20 p-8 bg-white rounded-[3rem] shadow-2xl hidden mx-4 border border-slate-100">
        <h2 class="text-3xl font-black mb-2 text-slate-800 tracking-tighter">Travel Log</h2>
        <p class="text-slate-400 mb-8 font-semibold italic">Spend Smart, Travel More</p>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="이메일" class="form-input">
            <input type="password" id="password" placeholder="비밀번호" class="form-input">
            <button onclick="handleLogin()" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl active:scale-95 transition-all">로그인</button>
            <button onclick="handleSignUp()" class="w-full text-slate-400 py-2 text-sm font-bold">회원가입</button>
        </div>
    </div>

    <!-- 2. 메인 앱 섹션 -->
    <div id="app-section" class="hidden">
        <header class="bg-white/90 backdrop-blur-md p-5 border-b flex justify-between items-center sticky top-0 z-50">
            <h1 class="font-black text-2xl text-blue-600 tracking-tighter italic">TRAVEL LOG</h1>
            <button id="btn-logout" onclick="handleLogout()" class="text-[10px] font-black text-slate-400 bg-slate-50 px-4 py-2 rounded-full border border-slate-100 uppercase tracking-widest">Logout</button>
        </header>

        <!-- 하단 내비게이션 -->
        <nav id="bottom-nav" class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white rounded-[2.5rem] flex justify-around p-3 z-50 shadow-[0_20px_50px_rgba(0,0,0,0.15)] border border-slate-100">
            <button id="tab-btn-input" onclick="showTab('input')" class="flex-1 py-3 text-center rounded-[1.25rem] transition-all font-black text-sm">기록</button>
            <button id="tab-btn-list" onclick="showTab('list')" class="flex-1 py-3 text-center rounded-[1.25rem] transition-all font-black text-sm">목록</button>
            <button id="tab-btn-settle" onclick="showTab('settle')" class="flex-1 py-3 text-center rounded-[1.25rem] transition-all font-black text-sm">정산</button>
        </nav>

        <main class="max-w-md mx-auto p-4">
            <!-- 탭 1: 기록 -->
            <section id="tab-input" class="hidden space-y-4">
                <div id="no-trip-msg" class="bg-white p-12 rounded-[2.5rem] text-center shadow-xl border border-slate-100 hidden">
                    <p class="text-slate-400 mb-6 font-bold text-sm">진행 중인 여행을 선택해주세요</p>
                    <button onclick="showTab('list')" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black shadow-lg shadow-blue-100">여행 목록으로 이동</button>
                </div>
                <div id="input-form" class="hidden bg-white p-7 rounded-[2.5rem] shadow-xl border border-slate-100 space-y-6">
                    <div class="flex justify-between items-center pb-4 border-b">
                        <h2 id="current-trip-name" class="text-xl font-black text-slate-800 pr-2 full-title"></h2>
                        <div class="flex bg-slate-100 p-1 rounded-xl shrink-0">
                            <button id="type-pre" onclick="setExpType('사전')" class="px-4 py-1.5 text-xs rounded-lg font-black transition-all">사전</button>
                            <button id="type-act" onclick="setExpType('현지')" class="px-4 py-1.5 text-xs rounded-lg font-black transition-all">현지</button>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Payer & Date</label>
                            <div id="payer-list" class="flex flex-wrap gap-2 mb-2"></div>
                            <div class="flex gap-2">
                                <input type="date" id="exp-date" class="form-input text-sm">
                                <div class="flex bg-slate-100 p-1 rounded-2xl w-32 shrink-0">
                                    <button id="method-cash" onclick="setExpMethod('현금')" class="flex-1 toggle-btn">현금</button>
                                    <button id="method-card" onclick="setExpMethod('카드')" class="flex-1 toggle-btn">카드</button>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Expense Details</label>
                            <input type="text" id="exp-name" placeholder="무엇을 위해 지출했나요?" class="form-input text-lg">
                            <input type="number" id="exp-amount" placeholder="0" class="form-input text-4xl font-black text-blue-600">
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Split With</label>
                            <div id="split-list" class="flex flex-wrap gap-2"></div>
                        </div>
                        <textarea id="exp-memo" placeholder="메모 (장소 등)" class="form-input h-24 text-sm"></textarea>
                        <button id="save-btn" onclick="saveExpense()" class="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black text-xl shadow-2xl shadow-blue-100 active:scale-95 transition-all">지출 기록 완료</button>
                    </div>
                </div>
            </section>

            <!-- 탭 2: 목록 -->
            <section id="tab-list" class="hidden space-y-6">
                <div class="flex justify-between items-center px-2">
                    <h2 class="font-black text-2xl text-slate-800 tracking-tight">내 여행</h2>
                    <button id="btn-add-trip" onclick="createNewTrip()" class="bg-white text-blue-600 px-5 py-2.5 rounded-full text-xs font-black shadow-sm border border-slate-100">+ New Trip</button>
                </div>
                <div id="trip-card-container" class="space-y-4"></div>
            </section>

            <!-- 탭 3: 정산 -->
            <section id="tab-settle" class="hidden space-y-4">
                <div class="px-4 py-6 bg-blue-600 rounded-[2.5rem] shadow-xl shadow-blue-100 text-white mb-6">
                    <p class="text-[10px] font-black text-blue-200 uppercase tracking-widest mb-1">Final Settlement for</p>
                    <h2 id="settle-trip-name" class="font-black text-2xl full-title">선택된 여행 없음</h2>
                </div>
                <div id="settle-result-container" class="space-y-4 pb-20"></div>
            </section>

            <!-- 탭 4: 상세 (레이아웃 수정됨) -->
            <section id="tab-detail" class="hidden space-y-6">
                <!-- 헤더: 제목 줄바꿈 대응 -->
                <div class="space-y-4 px-2">
                    <div class="flex items-start gap-3">
                        <button onclick="showTab('list')" class="bg-white p-3 rounded-2xl shadow-sm text-slate-400 font-bold shrink-0">←</button>
                        <h2 id="detail-title" class="font-black text-2xl text-slate-800 full-title pt-1 flex-1"></h2>
                    </div>
                    <!-- 액션 버튼들 전용 바 -->
                    <div class="flex gap-2">
                        <button id="btn-share" onclick="shareTrip()" class="flex-1 py-3.5 bg-slate-100 text-slate-600 rounded-2xl font-black text-xs shadow-sm active:scale-95 transition-all">공유하기</button>
                        <button onclick="goToSettleFromDetail()" class="flex-1 py-3.5 bg-blue-600 text-white rounded-2xl font-black text-xs shadow-lg shadow-blue-100 active:scale-95 transition-all">정산 확인</button>
                    </div>
                </div>

                <div class="bg-amber-100/50 p-6 rounded-[2.5rem] border border-amber-200/50 shadow-sm mx-1">
                    <label class="text-[10px] font-black text-amber-500 uppercase tracking-widest mb-3 block">Overall Memo</label>
                    <textarea id="trip-general-memo" onchange="updateTripMemo()" placeholder="여행의 중요한 정보를 적어두세요." class="w-full bg-transparent border-none text-sm text-amber-900 font-bold h-24 focus:outline-none placeholder:text-amber-200 resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4 px-1">
                    <div class="bg-slate-800 p-5 rounded-[2rem] text-white shadow-xl">
                        <p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Pre-trip 사전</p>
                        <p id="sum-pre" class="font-black text-xl">0</p>
                    </div>
                    <div class="bg-blue-600 p-5 rounded-[2rem] text-white shadow-xl shadow-blue-100">
                        <p class="text-[10px] font-black text-blue-200 mb-2 uppercase tracking-widest">Actual 현지</p>
                        <p id="sum-act" class="font-black text-xl">0</p>
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-100 border border-slate-50 p-2 min-h-[450px]">
                    <div id="expense-list-container"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://ejalawrpzmbanhjkfwxr.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_AVP0pqFeMHynravz8dd_nw___4f9zQo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isShareMode = false;
        let currentTripId = localStorage.getItem('lastTripId');
        let currentTripName = localStorage.getItem('lastTripName');
        let currentTripMembers = [];
        let viewingTripId = null;
        let viewingTripName = '';
        let selectedExpType = '현지';
        let selectedMethod = '현금';
        let selectedPayer = '';
        let selectedSplitMembers = [];

        function showAuth() { document.getElementById('auth-section').classList.remove('hidden'); document.getElementById('app-section').classList.add('hidden'); }
        function showApp() { document.getElementById('app-section').classList.remove('hidden'); document.getElementById('auth-section').classList.add('hidden'); showTab('input'); }

        async function handleLogin() {
            const e = document.getElementById('email').value.trim(); const p = document.getElementById('password').value.trim();
            const { error } = await _supabase.auth.signInWithPassword({ email: e, password: p });
            if (error) alert(error.message); else location.reload();
        }
        async function handleSignUp() {
            const e = document.getElementById('email').value.trim(); const p = document.getElementById('password').value.trim();
            const { error } = await _supabase.auth.signUp({ email: e, password: p });
            if (error) alert(error.message); else alert('가입 성공! 로그인하세요.');
        }
        function handleLogout() { _supabase.auth.signOut(); location.reload(); }

        function showTab(tabName) {
            if(isShareMode && (tabName === 'input' || tabName === 'list')) return; 
            ['tab-input', 'tab-list', 'tab-settle', 'tab-detail'].forEach(id => document.getElementById(id)?.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            const isActive = "text-blue-600 bg-blue-50";
            const isInactive = "text-slate-300";

            ['input', 'list', 'settle'].forEach(id => {
                const btn = document.getElementById(`tab-btn-${id}`);
                if (btn) btn.className = `flex-1 py-3 text-center rounded-[1.25rem] transition-all font-black text-sm ${tabName === id || (tabName === 'detail' && id === 'list') ? isActive : isInactive}`;
            });

            if (tabName === 'input') refreshInputTab();
            if (tabName === 'list') loadTrips();
            if (tabName === 'settle') calculateSettlement();
        }

        function setExpType(type) {
            selectedExpType = type;
            const preBtn = document.getElementById('type-pre'); const actBtn = document.getElementById('type-act');
            if (type === '사전') { preBtn.className = "px-5 py-2 toggle-btn rounded-xl bg-slate-800 text-white shadow-md"; actBtn.className = "px-5 py-2 toggle-btn rounded-xl inactive-btn"; }
            else { actBtn.className = "px-5 py-2 toggle-btn rounded-xl active-blue"; preBtn.className = "px-5 py-2 toggle-btn rounded-xl inactive-btn"; }
        }

        function setExpMethod(method) {
            selectedMethod = method;
            const cashBtn = document.getElementById('method-cash'); const cardBtn = document.getElementById('method-card');
            if (method === '현금') { cashBtn.className = "flex-1 toggle-btn active-cash"; cardBtn.className = "flex-1 toggle-btn inactive-btn"; }
            else { cardBtn.className = "flex-1 toggle-btn active-card"; cashBtn.className = "flex-1 toggle-btn inactive-btn"; }
        }

        async function loadTrips() {
            const { data: trips } = await _supabase.from('trips').select('*').order('is_completed', { ascending: true }).order('created_at', { ascending: false });
            const container = document.getElementById('trip-card-container');
            if(!container) return; container.innerHTML = '';
            trips?.forEach(trip => {
                const isActive = currentTripId == trip.id;
                container.innerHTML += `
                    <div class="bg-white p-7 rounded-[2.5rem] border border-slate-100 shadow-xl shadow-slate-200/50 ${trip.is_completed?'trip-completed':''}">
                        <div class="flex justify-between items-start mb-6">
                            <div onclick="showTripDetail(${trip.id}, '${trip.title.replace(/'/g, "\\'")}')" class="flex-1 cursor-pointer pr-4">
                                <h3 class="font-black text-slate-800 text-xl tracking-tight mb-1 full-title">${trip.title} ${trip.is_completed?'✅':''}</h3>
                                <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Click for history</p>
                            </div>
                            ${!trip.is_completed ? `<button onclick="selectTrip(${trip.id}, '${trip.title.replace(/'/g, "\\'")}')" class="px-6 py-3 rounded-2xl text-[10px] font-black shrink-0 ${isActive ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}">${isActive ? 'RECORDING' : 'SELECT'}</button>` : ''}
                        </div>
                        <button onclick="toggleTripStatus(${trip.id}, ${trip.is_completed})" class="w-full py-3 text-[10px] font-black rounded-2xl border border-slate-100 text-slate-400 bg-slate-50 uppercase tracking-widest">${trip.is_completed?'Restart':'Finish Trip'}</button>
                    </div>`;
            });
        }

        async function toggleTripStatus(id, currentStatus) {
            if(!currentStatus && !confirm('여행을 종료할까요?')) return;
            const { error } = await _supabase.from('trips').update({ is_completed: !currentStatus }).eq('id', id);
            if(!error) { if(!currentStatus && currentTripId == id) { currentTripId = null; currentTripName = null; localStorage.removeItem('lastTripId'); localStorage.removeItem('lastTripName'); } loadTrips(); }
        }

        function selectTrip(id, title) { currentTripId = id; currentTripName = title; localStorage.setItem('lastTripId', id); localStorage.setItem('lastTripName', title); showTab('input'); }

        async function createNewTrip() {
            const title = prompt('여행 이름을 입력하세요'); if (!title) return;
            const mStr = prompt('멤버 이름 (쉼표 구분: 나,친구1,친구2)'); if (!mStr) return;
            const members = mStr.split(',').map(n => { const name = n.trim(); const acc = prompt(`'${name}'의 계좌번호`, ''); return { name, account: acc }; });
            const { data } = await _supabase.from('trips').insert([{ title, members, user_id: currentUser.id }]).select();
            if (data) loadTrips();
        }

        async function refreshInputTab() {
            if (currentTripId) {
                document.getElementById('input-form').classList.remove('hidden'); document.getElementById('no-trip-msg').classList.add('hidden');
                document.getElementById('current-trip-name').innerText = currentTripName;
                const { data: trip } = await _supabase.from('trips').select('members').eq('id', currentTripId).single();
                currentTripMembers = trip?.members || [];
                renderMemberChips(); setExpType('현지'); setExpMethod('현금');
            } else { document.getElementById('input-form').classList.add('hidden'); document.getElementById('no-trip-msg').classList.remove('hidden'); }
        }

        function renderMemberChips() {
            const pCont = document.getElementById('payer-list'); const sCont = document.getElementById('split-list');
            if(!pCont) return; pCont.innerHTML = ''; sCont.innerHTML = '';
            if (selectedPayer === '' && currentTripMembers.length > 0) selectedPayer = currentTripMembers[0].name;
            if (selectedSplitMembers.length === 0) selectedSplitMembers = currentTripMembers.map(m => m.name);
            currentTripMembers.forEach(m => {
                const pChip = document.createElement('div'); pChip.className = `member-chip ${selectedPayer === m.name ? 'chip-selected' : 'chip-unselected'}`;
                pChip.innerText = m.name; pChip.onclick = () => { selectedPayer = m.name; renderMemberChips(); }; pCont.appendChild(pChip);
                const sChip = document.createElement('div'); sChip.className = `member-chip ${selectedSplitMembers.includes(m.name) ? 'chip-selected' : 'chip-unselected'}`;
                sChip.innerText = m.name; sChip.onclick = () => { if (selectedSplitMembers.includes(m.name)) selectedSplitMembers = selectedSplitMembers.filter(n => n !== m.name); else selectedSplitMembers.push(m.name); renderMemberChips(); }; sCont.appendChild(sChip);
            });
        }

        async function saveExpense() {
            const name = document.getElementById('exp-name').value; const amount = document.getElementById('exp-amount').value;
            if (!name || !amount) return; const btn = document.getElementById('save-btn'); btn.innerText = "SAVING...";
            await _supabase.from('expenses').insert([{ trip_id: currentTripId, item_name: name, amount, paid_by: selectedPayer, split_members: selectedSplitMembers, spent_at: document.getElementById('exp-date').value, payment_method: selectedMethod, memo: document.getElementById('exp-memo').value, expense_type: selectedExpType }]);
            document.getElementById('exp-name').value = ''; document.getElementById('exp-amount').value = ''; document.getElementById('exp-memo').value = '';
            btn.innerText = "SAVED!"; setTimeout(() => { btn.innerText = "지출 기록 완료"; }, 1000);
        }

        function goToSettleFromDetail() { currentTripId = viewingTripId; currentTripName = viewingTripName; showTab('settle'); }

        async function calculateSettlement() {
            const tripId = currentTripId || localStorage.getItem('lastTripId'); if (!tripId) return;
            const { data: trip } = await _supabase.from('trips').select('*').eq('id', tripId).single();
            const { data: expenses } = await _supabase.from('expenses').select('*').eq('trip_id', tripId);
            document.getElementById('settle-trip-name').innerText = trip.title;
            const container = document.getElementById('settle-result-container'); container.innerHTML = '';
            let balances = {}; trip.members.forEach(m => balances[m.name] = 0);
            expenses?.forEach(exp => { const amt = Number(exp.amount); const share = amt / (exp.split_members?.length || 1); balances[exp.paid_by] += amt; exp.split_members?.forEach(m => balances[m] -= share); });
            let receivers = [], givers = [];
            for (let name in balances) { if (balances[name] > 1) receivers.push({ name, amt: balances[name] }); else if (balances[name] < -1) givers.push({ name, amt: Math.abs(balances[name]) }); }
            givers.forEach(g => {
                receivers.forEach(r => {
                    if (g.amt <= 0 || r.amt <= 0) return;
                    const payAmt = Math.min(g.amt, r.amt); const acc = trip.members.find(m => m.name === r.name)?.account || '계좌 정보 없음';
                    container.innerHTML += `<div class="bg-white p-7 rounded-[2.5rem] shadow-xl border border-slate-50"><div class="text-xl font-black mb-2"><span class="text-red-500">${g.name}</span> → <span class="text-blue-600">${r.name}</span></div><div class="text-3xl font-black mb-3">${Math.round(payAmt).toLocaleString()}원</div><div class="bg-slate-50 p-4 rounded-2xl text-xs font-bold text-slate-500 italic tracking-tighter">🏦 ${acc}</div></div>`;
                    g.amt -= payAmt; r.amt -= payAmt;
                });
            });
            if (!container.innerHTML) container.innerHTML = '<p class="text-center py-24 text-slate-400 font-black">정산할 내역이 없습니다.</p>';
        }

        async function showTripDetail(tripId, title) {
            viewingTripId = tripId; viewingTripName = title; showTab('detail');
            const { data: tripData } = await _supabase.from('trips').select('*').eq('id', tripId).single();
            const { data: expenses } = await _supabase.from('expenses').select('*').eq('trip_id', tripId).order('spent_at', { ascending: false });
            if(tripData) document.getElementById('detail-title').innerText = tripData.title;
            document.getElementById('trip-general-memo').value = tripData?.memo || '';
            const container = document.getElementById('expense-list-container');
            let pre = 0, act = 0; container.innerHTML = '';
            expenses?.forEach(exp => {
                const type = exp.expense_type || '현지'; const isPre = type === '사전';
                if(isPre) pre += Number(exp.amount); else act += Number(exp.amount);
                container.innerHTML += `
                    <div class="expense-row text-xs">
                        <div class="text-slate-300 font-black ${isPre?'':'text-blue-400'} mt-1">${exp.spent_at?.slice(5) || '00-00'}</div>
                        <div class="flex flex-col pr-1 overflow-hidden">
                            <div class="font-black text-slate-800 text-[15px]">${isShareMode ? `<span>${exp.item_name}</span>` : `<input type="text" onchange="updateExp(${exp.id},'item_name',this.value)" value="${exp.item_name}" class="font-black bg-transparent w-full">`}</div>
                            <div class="text-[9px] font-bold text-slate-400 mt-1 uppercase">${exp.paid_by} Paid | ${exp.split_members?.length} People</div>
                            ${exp.memo ? `<div class="text-[10px] text-slate-400 mt-1 italic">${exp.memo}</div>` : ''}
                        </div>
                        <div class="text-right font-black text-[17px] ${type==='사전'?'text-slate-400':'text-blue-600'} pt-0.5">${Number(exp.amount).toLocaleString()}</div>
                        ${isShareMode ? '<div></div>' : `<button onclick="deleteExp(${exp.id},${tripId},'${title}')" class="text-slate-200 hover:text-red-400 transition-colors mt-1">✕</button>`}
                    </div>`;
            });
            document.getElementById('sum-pre').innerText = pre.toLocaleString(); document.getElementById('sum-act').innerText = act.toLocaleString();
        }

        async function updateExp(id, f, v) { if(isShareMode) return; await _supabase.from('expenses').update({ [f]: v }).eq('id', id); }
        async function deleteExp(id, tid, t) { if(isShareMode) return; if(confirm('기록을 삭제할까요?')) { await _supabase.from('expenses').delete().eq('id', id); showTripDetail(tid, t); } }
        async function updateTripMemo() { if(isShareMode) return; const v = document.getElementById('trip-general-memo').value; if(viewingTripId) await _supabase.from('trips').update({ memo: v }).eq('id', viewingTripId); }

        function shareTrip() {
            const shareUrl = `${window.location.origin}${window.location.pathname}?share=${viewingTripId}`;
            navigator.clipboard.writeText(shareUrl).then(() => alert("공유 링크 복사 완료!")).catch(() => prompt("링크 복사:", shareUrl));
        }

        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const shareId = params.get('share');
            if (shareId) {
                isShareMode = true; document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('btn-logout').classList.add('share-hide'); document.getElementById('bottom-nav').classList.add('share-hide');
                document.getElementById('btn-share').classList.add('share-hide'); document.getElementById('btn-add-trip').classList.add('share-hide');
                document.getElementById('trip-general-memo').readOnly = true; showTripDetail(shareId, 'Shared Trip');
            } else {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) { currentUser = session.user; showApp(); } else { showAuth(); }
            }
        };
    </script>
</body>
</html>
