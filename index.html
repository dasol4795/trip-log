<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트래블 머니 로그</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        
        /* 세련된 버튼 애니메이션 */
        .toggle-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 800; font-size: 0.875rem; border-radius: 1rem; }
        .active-cash { background-color: #f59e0b; color: white; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .active-card { background-color: #6366f1; color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .inactive-btn { background-color: #f1f5f9; color: #94a3b8; }

        .form-input { 
            background-color: #ffffff; 
            border: 2px solid #f1f5f9; 
            border-radius: 1.25rem; 
            padding: 1rem 1.25rem; 
            width: 100%; 
            transition: all 0.2s;
            font-weight: 600;
        }
        .form-input:focus { border-color: #3b82f6; outline: none; background-color: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        .expense-row { display: grid; grid-template-columns: 55px 1fr 100px 35px; gap: 12px; align-items: start; padding: 16px 10px; border-bottom: 1px solid #f1f5f9; }
        .trip-completed { opacity: 0.6; filter: grayscale(0.6); }
    </style>
</head>
<body class="text-slate-900 pb-32">

    <!-- 로그인 -->
    <div id="auth-section" class="max-w-md mx-auto mt-20 p-8 bg-white rounded-[3rem] shadow-2xl hidden mx-4 border border-slate-100">
        <h2 class="text-3xl font-black mb-2 text-slate-800 tracking-tighter">Travel Log</h2>
        <p class="text-slate-400 mb-8 font-semibold">여행의 모든 순간을 기록하세요</p>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="이메일" class="form-input">
            <input type="password" id="password" placeholder="비밀번호" class="form-input">
            <button onclick="handleLogin()" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl active:scale-95 transition-all">로그인</button>
            <button onclick="handleSignUp()" class="w-full text-slate-400 py-2 text-sm font-bold">새로운 계정 만들기</button>
        </div>
    </div>

    <!-- 메인 앱 -->
    <div id="app-section" class="hidden">
        <header class="bg-white/90 backdrop-blur-md p-6 border-b flex justify-between items-center sticky top-0 z-50">
            <h1 class="font-black text-2xl text-blue-600 tracking-tighter italic">TRAVEL LOG</h1>
            <button onclick="handleLogout()" class="text-[10px] font-black text-slate-400 bg-slate-50 px-4 py-2 rounded-full border border-slate-100 uppercase tracking-widest">Logout</button>
        </header>

        <!-- 세련된 하단 바 -->
        <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white rounded-[2.5rem] flex justify-around p-3 z-50 shadow-[0_20px_50px_rgba(0,0,0,0.15)] border border-slate-100">
            <button id="tab-btn-input" onclick="showTab('input')" class="flex-1 py-4 text-center rounded-[1.5rem] transition-all font-black">기록</button>
            <button id="tab-btn-list" onclick="showTab('list')" class="flex-1 py-4 text-center rounded-[1.5rem] transition-all font-black">목록</button>
        </nav>

        <main class="max-w-md mx-auto p-4">
            <!-- 탭 1: 기록 -->
            <section id="tab-input" class="space-y-4">
                <div id="no-trip-msg" class="bg-white p-12 rounded-[2.5rem] text-center shadow-xl border border-slate-100 hidden">
                    <p class="text-slate-400 mb-6 font-bold text-sm">진행 중인 여행을 선택해주세요</p>
                    <button onclick="showTab('list')" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black shadow-lg shadow-blue-100">여행 목록으로 이동</button>
                </div>

                <div id="input-form" class="hidden space-y-4">
                    <div class="bg-white p-7 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100">
                        <!-- 사전/현지 선택 버튼 그룹 -->
                        <div class="flex justify-between items-center mb-8 pb-6 border-b border-slate-50">
                            <h2 id="current-trip-name" class="text-xl font-black text-slate-800 truncate pr-4"></h2>
                            <div class="flex bg-slate-100 p-1.5 rounded-2xl shrink-0">
                                <button id="type-pre" onclick="setExpType('사전')" class="px-5 py-2 toggle-btn rounded-xl">사전</button>
                                <button id="type-act" onclick="setExpType('현지')" class="px-5 py-2 toggle-btn rounded-xl">현지</button>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">When & Method</label>
                                <div class="flex gap-2">
                                    <input type="date" id="exp-date" class="form-input text-sm">
                                    <!-- 결제수단 버튼 그룹 -->
                                    <div class="flex bg-slate-100 p-1 rounded-2xl w-32 shrink-0">
                                        <button id="method-cash" onclick="setExpMethod('현금')" class="flex-1 toggle-btn rounded-xl text-xs">현금</button>
                                        <button id="method-card" onclick="setExpMethod('카드')" class="flex-1 toggle-btn rounded-xl text-xs">카드</button>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Detail</label>
                                <input type="text" id="exp-name" placeholder="무엇을 위해 지출했나요?" class="form-input text-lg">
                                <input type="number" id="exp-amount" placeholder="0" class="form-input text-4xl font-black text-blue-600 placeholder:text-slate-100">
                                <textarea id="exp-memo" placeholder="상세 메모 (장소 등)" class="form-input h-24 text-sm resize-none"></textarea>
                            </div>

                            <button id="save-btn" onclick="saveExpense()" class="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black text-xl shadow-2xl shadow-blue-200 active:scale-95 transition-all">지출 기록 완료</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 탭 2: 목록 -->
            <section id="tab-list" class="hidden space-y-6 pb-20">
                <div class="flex justify-between items-center px-4">
                    <h2 class="font-black text-2xl text-slate-800 tracking-tight">MY TRIPS</h2>
                    <button onclick="createNewTrip()" class="bg-blue-600 text-white px-5 py-2.5 rounded-full text-xs font-black shadow-lg shadow-blue-100">+ New</button>
                </div>
                <div id="trip-card-container" class="space-y-4"></div>
            </section>

            <!-- 탭 3: 상세 -->
            <section id="tab-detail" class="hidden space-y-4 pb-20">
                <div class="flex items-center gap-4 px-4">
                    <button onclick="showTab('list')" class="bg-white p-3 rounded-2xl shadow-md text-slate-400 font-bold">←</button>
                    <h2 id="detail-title" class="font-black text-2xl text-slate-800 truncate"></h2>
                </div>

                <div class="bg-amber-100/50 p-6 rounded-[2.5rem] border border-amber-200/50 shadow-sm mx-2">
                    <label class="text-[10px] font-black text-amber-500 uppercase tracking-widest mb-3 block">Overall Memo</label>
                    <textarea id="trip-general-memo" onchange="updateTripMemo()" placeholder="여행의 중요한 정보를 적어두세요." class="w-full bg-transparent border-none text-sm text-amber-900 font-bold h-24 focus:outline-none placeholder:text-amber-200 resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4 px-2">
                    <div class="bg-slate-800 p-5 rounded-[2rem] text-white shadow-xl"><p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Pre-trip</p><p id="sum-pre" class="font-black text-2xl">0</p></div>
                    <div class="bg-blue-600 p-5 rounded-[2rem] text-white shadow-xl shadow-blue-100"><p class="text-[10px] font-black text-blue-200 mb-2 uppercase tracking-widest">Actual</p><p id="sum-act" class="font-black text-2xl">0</p></div>
                </div>

                <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 p-4 min-h-[400px]">
                    <div id="expense-list-container"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://ejalawrpzmbanhjkfwxr.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_AVP0pqFeMHynravz8dd_nw___4f9zQo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentTripId = localStorage.getItem('lastTripId');
        let currentTripName = localStorage.getItem('lastTripName');
        let viewingTripId = null;
        let selectedExpType = '현지';
        let selectedMethod = '현금';

        window.showAuth = () => { document.getElementById('auth-section').classList.remove('hidden'); document.getElementById('app-section').classList.add('hidden'); };
        window.showApp = () => { document.getElementById('app-section').classList.remove('hidden'); document.getElementById('auth-section').classList.add('hidden'); showTab('input'); };

        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { currentUser = session.user; showApp(); } else { showAuth(); }
        };

        async function handleLogin() {
            const { error } = await _supabase.auth.signInWithPassword({ email: email.value, password: password.value });
            if (error) alert(error.message); else location.reload();
        }
        async function handleSignUp() {
            const { error } = await _supabase.auth.signUp({ email: email.value, password: password.value });
            if (error) alert(error.message); else alert('가입 성공!');
        }
        function handleLogout() { _supabase.auth.signOut(); location.reload(); }

        function showTab(tabName) {
            ['tab-input', 'tab-list', 'tab-detail'].forEach(id => document.getElementById(id)?.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`)?.classList.remove('hidden');
            const btnInput = document.getElementById('tab-btn-input');
            const btnList = document.getElementById('tab-btn-list');
            if (tabName === 'input') { btnInput.classList.replace('text-white/50', 'text-blue-600'); btnList.classList.replace('text-blue-600', 'text-white/50'); }
            else { btnList.classList.replace('text-white/50', 'text-blue-600'); btnInput.classList.replace('text-blue-600', 'text-white/50'); }
            if (tabName === 'input') refreshInputTab();
            if (tabName === 'list') loadTrips();
        }

        function setExpType(type) {
            selectedExpType = type;
            const preBtn = document.getElementById('type-pre');
            const actBtn = document.getElementById('type-act');
            if (type === '사전') { preBtn.className = "px-5 py-2 toggle-btn rounded-xl bg-slate-800 text-white shadow-md"; actBtn.className = "px-5 py-2 toggle-btn rounded-xl inactive-btn"; }
            else { actBtn.className = "px-5 py-2 toggle-btn rounded-xl active-card"; preBtn.className = "px-5 py-2 toggle-btn rounded-xl inactive-btn"; }
        }

        function setExpMethod(method) {
            selectedMethod = method;
            const cashBtn = document.getElementById('method-cash');
            const cardBtn = document.getElementById('method-card');
            if (method === '현금') { cashBtn.className = "flex-1 toggle-btn rounded-xl text-xs active-cash"; cardBtn.className = "flex-1 toggle-btn rounded-xl text-xs inactive-btn"; }
            else { cardBtn.className = "flex-1 toggle-btn rounded-xl text-xs active-card"; cashBtn.className = "flex-1 toggle-btn rounded-xl text-xs inactive-btn"; }
        }

        function refreshInputTab() {
            if (currentTripId) {
                document.getElementById('input-form').classList.remove('hidden');
                document.getElementById('no-trip-msg').classList.add('hidden');
                document.getElementById('current-trip-name').innerText = currentTripName;
                document.getElementById('exp-date').valueAsDate = new Date();
                setExpType('현지'); setExpMethod('현금');
            } else {
                document.getElementById('input-form').classList.add('hidden');
                document.getElementById('no-trip-msg').classList.remove('hidden');
            }
        }

        async function createNewTrip() {
            const title = prompt('여행 이름을 입력하세요'); if (!title) return;
            const { data } = await _supabase.from('trips').insert([{ title, user_id: currentUser.id }]).select();
            if (data) selectTrip(data[0].id, data[0].title);
        }

        async function loadTrips() {
            const { data: trips } = await _supabase.from('trips').select('*').order('is_completed', { ascending: true }).order('created_at', { ascending: false });
            const container = document.getElementById('trip-card-container');
            container.innerHTML = '';
            trips?.forEach(trip => {
                const isActive = currentTripId == trip.id;
                const isComp = trip.is_completed;
                container.innerHTML += `
                    <div class="bg-white p-7 rounded-[2.5rem] border border-slate-100 shadow-xl shadow-slate-200/50 ${isComp ? 'trip-completed' : ''}">
                        <div class="flex justify-between items-start mb-6">
                            <div onclick="showTripDetail(${trip.id}, '${trip.title}')" class="flex-1 cursor-pointer">
                                <h3 class="font-black text-slate-800 text-xl tracking-tight mb-1">${trip.title} ${isComp ? '✅' : ''}</h3>
                                <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Click for detail</p>
                            </div>
                            ${!isComp ? `<button onclick="selectTrip(${trip.id}, '${trip.title}')" class="px-6 py-3 rounded-2xl text-[10px] font-black shrink-0 ${isActive ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}">${isActive ? 'RECORDING' : 'SELECT'}</button>` : ''}
                        </div>
                        <button onclick="toggleTripStatus(${trip.id}, ${isComp})" class="w-full py-3 text-[10px] font-black rounded-2xl border border-slate-100 text-slate-400 bg-slate-50 uppercase tracking-widest">${isComp ? 'Restart Trip' : 'Finish Trip'}</button>
                    </div>`;
            });
        }

        async function toggleTripStatus(id, currentStatus) {
            if(!currentStatus && !confirm('여행을 종료할까요?')) return;
            const { error } = await _supabase.from('trips').update({ is_completed: !currentStatus }).eq('id', id);
            if(!error) { if(!currentStatus && currentTripId == id) { currentTripId = null; currentTripName = null; localStorage.removeItem('lastTripId'); localStorage.removeItem('lastTripName'); } loadTrips(); }
        }

        function selectTrip(id, title) { currentTripId = id; currentTripName = title; localStorage.setItem('lastTripId', id); localStorage.setItem('lastTripName', title); showTab('input'); }

        async function updateTripMemo() { const memoValue = document.getElementById('trip-general-memo').value; if (viewingTripId) await _supabase.from('trips').update({ memo: memoValue }).eq('id', viewingTripId); }

        async function showTripDetail(tripId, title) {
            viewingTripId = tripId; showTab('detail'); document.getElementById('detail-title').innerText = title;
            const { data: tripData } = await _supabase.from('trips').select('memo').eq('id', tripId).single();
            const { data: expenses } = await _supabase.from('expenses').select('*').eq('trip_id', tripId).order('spent_at', { ascending: false });
            document.getElementById('trip-general-memo').value = tripData?.memo || '';
            const container = document.getElementById('expense-list-container');
            let preTotal = 0, actTotal = 0; container.innerHTML = '';
            if(!expenses || expenses.length === 0) { container.innerHTML = '<p class="text-center py-24 text-slate-200 font-black">NO DATA</p>'; document.getElementById('sum-pre').innerText = "0"; document.getElementById('sum-act').innerText = "0"; return; }
            expenses.forEach(exp => {
                const type = exp.expense_type || '현지'; const isPre = type === '사전';
                if(isPre) preTotal += Number(exp.amount); else actTotal += Number(exp.amount);
                container.innerHTML += `
                    <div class="expense-row">
                        <div class="text-[10px] font-black ${isPre ? 'text-slate-300' : 'text-blue-400'} mt-1">${exp.spent_at ? exp.spent_at.slice(5) : '00-00'}</div>
                        <div class="flex flex-col pr-1 overflow-hidden">
                            <input type="text" onchange="updateExp(${exp.id}, 'item_name', this.value)" value="${exp.item_name}" class="font-black text-slate-800 bg-transparent text-[15px]">
                            <input type="text" onchange="updateExp(${exp.id}, 'memo', this.value)" value="${exp.memo || ''}" placeholder="Add memo..." class="text-[11px] text-slate-400 bg-transparent">
                            <div class="flex items-center gap-1.5 mt-2">
                                <span class="type-badge ${isPre ? 'badge-pre' : 'badge-act'}">${type}</span>
                                <span class="text-[9px] font-black text-slate-200 uppercase">${exp.payment_method || ''}</span>
                            </div>
                        </div>
                        <input type="number" onchange="updateExp(${exp.id}, 'amount', this.value)" value="${exp.amount}" class="font-black text-[18px] text-right ${isPre ? 'text-slate-400' : 'text-blue-600'} bg-transparent">
                        <button onclick="deleteExp(${exp.id}, ${tripId}, '${title}')" class="text-slate-200 hover:text-red-400 transition-colors mt-1">✕</button>
                    </div>`;
            });
            document.getElementById('sum-pre').innerText = preTotal.toLocaleString();
            document.getElementById('sum-act').innerText = actTotal.toLocaleString();
        }

        async function updateExp(id, f, v) { await _supabase.from('expenses').update({ [f]: v }).eq('id', id); }
        async function deleteExp(id, tid, t) { if(confirm('삭제하시겠습니까?')) { await _supabase.from('expenses').delete().eq('id', id); showTripDetail(tid, t); } }

        async function saveExpense() {
            const name = document.getElementById('exp-name').value.trim();
            const amount = document.getElementById('exp-amount').value;
            if(!name || !amount) return;
            const btn = document.getElementById('save-btn');
            btn.innerText = "SAVING...";
            await _supabase.from('expenses').insert([{ trip_id: currentTripId, item_name: name, amount: amount, spent_at: document.getElementById('exp-date').value, payment_method: selectedMethod, memo: document.getElementById('exp-memo').value, expense_type: selectedExpType }]);
            document.getElementById('exp-name').value = ''; document.getElementById('exp-amount').value = ''; document.getElementById('exp-memo').value = '';
            setExpMethod('현금');
            setTimeout(() => { btn.innerText = "지출 기록 완료"; }, 1000);
        }
    </script>
</body>
</html>
